<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SUP Atlasz</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body,#map{
  height:100%;
  margin:0;
}

.title{
  position:absolute;
  z-index:1000;
  top:10px;
  left:50px;
  background:white;
  padding:8px 12px;
  border-radius:8px;
  font-family:sans-serif;
}
</style>
</head>

<body>

<div class="title">batabe 🏄 SUP Atlasz leaflet fix</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>

const map = L.map('map').setView([47.2,19.3],7);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
  attribution:'© OpenStreetMap'
}).addTo(map);

const overlays = {};

fetch('tracks.json')
.then(r => r.json())
.then(data => {

  Object.keys(data).forEach(category => {

    const layerGroup = L.layerGroup();
    overlays[category] = layerGroup;

    data[category].forEach(track => {

        const gpx = new L.GPX(track, {
          async: true,
          marker_options: {
            startIconUrl: null,
            endIconUrl: null,
            shadowUrl: null
          }
        });

      gpx.on('loaded', function(e) {

        const name =
          track.split('/').pop().replace('.gpx','');

        e.target.bindPopup(name);

      });

      gpx.addTo(layerGroup);

    });

    layerGroup.addTo(map);

  });

  L.control.layers(null, overlays).addTo(map);

});

</script>

</body>
</html>
